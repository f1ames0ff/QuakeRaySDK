# Standalone Linux quality gate for QuakeRaySDK (zero marketplace actions).
name: Quality Linux

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NVRHI_COMMIT: d0c8e30d5f8d58c3b838b06aa1d8d0a912bea076
  VULKAN_HEADERS_TAG: vulkan-sdk-1.4.328.0
  QR_DXC_VERSION: v1.9.2609
  QR_DXC_ASSET: linux_dxc_2026_09_28.x86_x64.tar.gz
  SONAR_CLI_VERSION: 6.2.1.4610

jobs:
  quality:
    name: ASan/UBSan + Static Analysis + Shaders
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository with full history
        shell: bash
        env:
          QR_REF: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --no-tags origin "$QR_REF"
          git checkout --force FETCH_HEAD
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags origin "$BASE_REF"
          else
            git fetch --no-tags origin main
          fi
          git fetch --no-tags --depth=50 origin HEAD
          git log -1 --oneline

      - name: Install build and analysis tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang clang-tidy cppcheck \
            glslang-tools libvulkan-dev libx11-dev \
            python3 python3-pip curl unzip tar ca-certificates
          python3 -m pip install --break-system-packages ruff lizard

      - name: Install pinned Vulkan headers, NVRHI, and Linux DXC
        shell: bash
        run: |
          set -euo pipefail
          deps="$RUNNER_TEMP/sdk-deps"
          mkdir -p "$deps/vulkan-headers" "$deps/nvrhi" "$deps/dxc"

          curl --location --fail --silent --show-error --retry 3 \
            "https://github.com/KhronosGroup/Vulkan-Headers/archive/refs/tags/${VULKAN_HEADERS_TAG}.tar.gz" \
            -o "$deps/vk.tar.gz"
          tar -xzf "$deps/vk.tar.gz" --strip-components=1 -C "$deps/vulkan-headers"

          git init -q "$deps/nvrhi"
          git -C "$deps/nvrhi" remote add origin https://github.com/NVIDIA-RTX/NVRHI.git
          git -C "$deps/nvrhi" fetch --depth=1 origin "$NVRHI_COMMIT"
          git -C "$deps/nvrhi" checkout --force FETCH_HEAD
          git -C "$deps/nvrhi" apply "$GITHUB_WORKSPACE/cmake/nvrhi-max-binding-layouts.patch"

          curl --location --fail --silent --show-error --retry 3 \
            "https://github.com/microsoft/DirectXShaderCompiler/releases/download/${QR_DXC_VERSION}/${QR_DXC_ASSET}" \
            -o "$deps/dxc.tar.gz"
          tar -xzf "$deps/dxc.tar.gz" -C "$deps/dxc"

          dxc_bin="$deps/dxc/bin/dxc"
          test -x "$dxc_bin"
          printf '[numthreads(1,1,1)]\nvoid main() {}\n' > "$RUNNER_TEMP/probe.hlsl"
          "$dxc_bin" -spirv -fspv-target-env=vulkan1.2 -T cs_6_2 -E main "$RUNNER_TEMP/probe.hlsl" -Fo "$RUNNER_TEMP/probe.spv"
          test -s "$RUNNER_TEMP/probe.spv"

          echo "VULKAN_HEADERS_DIR=$deps/vulkan-headers/include" >> "$GITHUB_ENV"
          echo "QR_NVRHI_DIR=$deps/nvrhi" >> "$GITHUB_ENV"
          echo "QR_DXC=$dxc_bin" >> "$GITHUB_ENV"
          echo "$deps/dxc/bin" >> "$GITHUB_PATH"

      - name: Build FidelityFX 1.1.4 Linux provider
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/quality/ffx
          QR_FFX_OUT_DIR="$PWD/build/quality/ffx" \
          GLSLANG_VALIDATOR="$(command -v glslangValidator)" \
          VULKAN_HEADERS_DIR="$VULKAN_HEADERS_DIR" \
          bash Source/FidelityFX_SDK_1.1.4/linux/build_provider.sh

      - name: Configure and build standalone QuakeRaySDK (Clang + ASan/UBSan)
        shell: bash
        run: |
          set -euo pipefail
          CC=clang CXX=clang++ cmake -S . -B build/quality -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DVulkan_INCLUDE_DIR="$VULKAN_HEADERS_DIR" \
            -DQR_NVRHI_SOURCE_DIR="$QR_NVRHI_DIR" \
            -DQR_FFX_VK_SO="$PWD/build/quality/ffx/libamd_fidelityfx_vk.so" \
            -DQR_DXC="$QR_DXC" \
            -DQR_BUILD_TESTS=ON \
            -DQR_ENABLE_SANITIZERS=ON
          cmake --build build/quality --parallel 4

      - name: Run CPU tests under ASan + UBSan
        shell: bash
        run: |
          set -euo pipefail
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
          UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
          ctest --test-dir build/quality --output-on-failure -LE gpu

      - name: Verify HLSL matrix reads and compile all shaders
        shell: bash
        run: |
          set -euo pipefail
          cd Source/Shaders
          python3 -B CheckMatrixReads.py
          log="$(python3 -B GenerateShaders.py -rebuild)"
          printf '%s\n' "$log"
          if printf '%s\n' "$log" | grep -qE 'shader builds? failed'; then
            echo "::error::GenerateShaders.py reported shader compilation failure"
            exit 1
          fi

      - name: Run quality script unit tests and diff-gated static analysis
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tools -p "test_*.py" -v
          if [ "$EVENT_NAME" = "pull_request" ]; then
            diff_base="origin/${BASE_REF}"
          elif [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            diff_base="$BEFORE_SHA"
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            diff_base="$(git rev-parse HEAD~1)"
          else
            diff_base="$(git rev-parse HEAD)"
          fi
          python3 -B tools/check_quality.py \
            --base "$diff_base" \
            --compile-commands build/quality/compile_commands.json \
            --strict-tools

      - name: Run SonarQube Cloud analysis
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "::notice::SONAR_TOKEN secret is not configured; skipping SonarQube Cloud scan."
            exit 0
          fi

          cli_dir="$RUNNER_TEMP/sonar-scanner"
          mkdir -p "$cli_dir"
          curl --location --fail --silent --show-error --retry 3 \
            "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-${SONAR_CLI_VERSION}-linux-x64.zip" \
            -o "$cli_dir/sonar.zip"
          unzip -q "$cli_dir/sonar.zip" -d "$cli_dir"
          scanner="$(find "$cli_dir" -maxdepth 3 -type f -name sonar-scanner | head -n 1)"

          sonar_args=(
            "-Dsonar.organization=${SONAR_ORGANIZATION:-f1ames0ff}"
            "-Dsonar.projectKey=${SONAR_PROJECT_KEY:-f1ames0ff_QuakeRaySDK}"
            "-Dsonar.qualitygate.wait=true"
          )
          if [ "$EVENT_NAME" = "pull_request" ]; then
            sonar_args+=(
              "-Dsonar.pullrequest.key=${PR_NUMBER}"
              "-Dsonar.pullrequest.branch=${HEAD_REF}"
              "-Dsonar.pullrequest.base=${BASE_REF}"
            )
          else
            sonar_args+=("-Dsonar.branch.name=${REF_NAME}")
          fi

          "$scanner" "${sonar_args[@]}"
